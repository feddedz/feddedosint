name = "feddedosint-api"
main = "worker.js"
compatibility_date = "2025-09-01"

# KV namespace (users, sessions, rate-limit counters).
# Create once:  wrangler kv namespace create USERS   -> paste the id below.
[[kv_namespaces]]
binding = "USERS"
id = "PASTE_YOUR_KV_NAMESPACE_ID_HERE"

[vars]
# Exact Gemini model id. List valid ones:
#   curl "https://generativelanguage.googleapis.com/v1beta/models?key=YOUR_KEY"
# Set to "BESTMODEL" to auto-pick the best available model and fall back when one is busy,
# or pin an exact id like "gemini-3.8-flash".
AI_MODEL = "BESTMODEL"

# Site origins allowed to call this Worker (comma-separated, no trailing slash).
ALLOWED_ORIGINS = "https://feddedz.github.io,http://localhost:8000"

# Where to send users back after GitHub login (your site, with trailing slash).
SITE_URL = "https://feddedz.github.io/feddedosint/"

# GitHub login + admin.
ADMIN_USER = "feddedz"
GITHUB_CLIENT_ID = "PASTE_YOUR_GITHUB_OAUTH_CLIENT_ID"

# Secrets (set from the CLI or the dashboard — never in this file):
#   wrangler secret put GEMINI_KEY
#   wrangler secret put GITHUB_CLIENT_SECRET
